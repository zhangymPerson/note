<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>纸与墨 · 方向 B 纸墨秩序 — 笔记原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   方向 B · 纸墨 + 秩序
   同 A 的纸墨家族，但秩序感更重：像一把刻度精准的尺。
   - 每一行都是「标题 / 摘要 / 时间」三区，宽屏右对齐 meta 列
   - 数字全部 tabular-nums，时间等宽
   - 强调色墨绿专职「该点这里 + 链接 + 焦点」
   - 骨架屏、空态线条画、行内展开过渡、顶栏 active 态
   ============================================================ */

      :root {
        --font-display:
          "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
        --font-body:
          system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --font-mono:
          ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

        --radius: 8px;
        --radius-sm: 6px;
        --content-max: 1120px;
        --topbar-h: 60px;

        --t-fast: 140ms ease;
        --t-slow: 200ms cubic-bezier(0.33, 1, 0.68, 1);

        /* 语义色：墨绿专职 + 朱砂危险 + 琥珀加密 */
        --focus-ring: 2px solid var(--accent);
      }

      /* ---- 亮 · 白纸 ---- */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f5f3ee;
        --surface: #fbfaf6;
        --surface-2: #eeebe3;
        --text: #2a2722;
        --muted: #6e695f;
        --faint: #837d6f;
        --border: #e0dad0;
        --border-strong: #c6beb0;
        --accent: #3a6a4d;
        --accent-ink: #285239;
        --on-accent: #f7f5ef;
        --accent-soft: #e6eee2;
        --danger: #b03e2c;
        --danger-soft: #f3e3dd;
        --amber: #9a6a1f;
        --amber-soft: #f4ead6;
        --mark-bg: #f5e6bd;
        --mark-ink: #4a3a0e;
        --shadow-card:
          0 1px 3px rgba(42, 39, 34, 0.07), 0 1px 1px rgba(42, 39, 34, 0.03);
        --shadow-row: 0 1px 2px rgba(42, 39, 34, 0.05);
        --shadow-lift: 0 6px 18px rgba(42, 39, 34, 0.09);
        --heat-1: #e1ebda;
        --heat-2: #c0d7b8;
        --heat-3: #84ac86;
        --heat-4: #3a6a4d;
      }

      /* ---- 暗 · 深墨纸 ---- */
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1b1a17;
        --surface: #23211d;
        --surface-2: #2b2924;
        --text: #e9e3d7;
        --muted: #a49d8e;
        --faint: #6e695e;
        --border: #38342c;
        --border-strong: #4c473d;
        --accent: #92bd98;
        --accent-ink: #aecaae;
        --on-accent: #15210f;
        --accent-soft: #26332a;
        --danger: #e29181;
        --danger-soft: #3b2722;
        --amber: #dba85c;
        --amber-soft: #3d3324;
        --mark-bg: #4a4233;
        --mark-ink: #e9e3d7;
        --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-row: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-lift: 0 8px 22px rgba(0, 0, 0, 0.5);
        --heat-1: #293527;
        --heat-2: #3a543c;
        --heat-3: #5f7f5f;
        --heat-4: #92bd98;
      }

      /* ---- 护眼 · 米绿纸 ---- */
      :root[data-theme="eye-care"] {
        color-scheme: light;
        --bg: #e9efdf;
        --surface: #f2f6e9;
        --surface-2: #dce6ce;
        --text: #33402f;
        --muted: #5b6952;
        --faint: #75816a;
        --border: #ccd6be;
        --border-strong: #aebda0;
        --accent: #3d7752;
        --accent-ink: #2c5a3e;
        --on-accent: #f4f7ed;
        --accent-soft: #dceadf;
        --danger: #9c4a33;
        --danger-soft: #e9ded4;
        --amber: #86601c;
        --amber-soft: #eae2cd;
        --mark-bg: #efe4bd;
        --mark-ink: #3d3e1e;
        --shadow-card: 0 1px 2px rgba(51, 64, 47, 0.09);
        --shadow-row: 0 1px 1px rgba(51, 64, 47, 0.06);
        --shadow-lift: 0 6px 16px rgba(51, 64, 47, 0.12);
        --heat-1: #dfe8d2;
        --heat-2: #bdd0ac;
        --heat-3: #88ac79;
        --heat-4: #3d7752;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        transition:
          background var(--t-fast),
          color var(--t-fast);
      }
      ::selection {
        background: var(--mark-bg);
        color: var(--mark-ink);
      }
      :focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
      }
      input,
      textarea,
      select {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }

      /* ============ 顶栏 ============ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 clamp(16px, 4vw, 40px);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.05em;
        color: var(--text);
        padding: 0 12px 0 2px;
      }
      .brand-mark {
        color: var(--accent);
      }
      .topnav {
        display: flex;
        gap: 2px;
        margin-left: 6px;
      }
      .topnav a {
        position: relative;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        font-size: 14.5px;
        color: var(--muted);
        transition:
          color var(--t-fast),
          background var(--t-fast);
      }
      .topnav a:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .topnav a[data-active="true"] {
        color: var(--accent-ink);
        font-weight: 600;
      }
      .topnav a[data-active="true"]::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: 3px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
      }
      .topbar .spacer {
        flex: 1;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        color: var(--muted);
      }
      .who:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        min-height: 40px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--muted);
        transition: all var(--t-fast);
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }
      .icon-btn svg {
        display: block;
      }

      /* ============ 布局 ============ */
      main {
        padding: 36px clamp(16px, 4vw, 40px) 80px;
      }
      .page {
        max-width: var(--content-max);
        margin: 0 auto;
      }

      .page-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      .page-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(25px, 2.8vw, 33px);
        letter-spacing: 0.02em;
        line-height: 1.3;
      }
      .page-sub {
        margin-top: 5px;
        font-size: 13px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .head-stat {
        text-align: right;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        line-height: 1.9;
      }
      .head-stat b {
        display: block;
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
      }

      /* ============ 卡片 ============ */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }
      .card-pad {
        padding: 20px 22px;
      }

      /* ============ 首页 ============ */
      .greet {
        margin-bottom: 26px;
      }
      .greet h1 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: clamp(24px, 2.7vw, 34px);
        letter-spacing: 0.02em;
        line-height: 1.3;
      }
      .greet .today {
        margin-top: 7px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .home-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .home-left,
      .home-right {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 0;
      }

      .search-form {
        display: flex;
        gap: 10px;
      }
      .search-input {
        flex: 1;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        transition:
          border-color var(--t-fast),
          box-shadow var(--t-fast);
      }
      .search-input::placeholder {
        color: var(--faint);
      }
      .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }
      .search-form button[type="submit"] {
        min-height: 44px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-size: 14.5px;
        font-weight: 600;
        transition:
          filter var(--t-fast),
          transform var(--t-fast);
      }
      .search-form button[type="submit"]:hover {
        filter: brightness(1.07);
        transform: translateY(-1px);
      }
      .search-form button[type="submit"]:active {
        transform: translateY(0);
      }

      .section-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: 0.03em;
        margin-bottom: 12px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .quick-text {
        width: 100%;
        min-height: 86px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--text);
        resize: vertical;
        line-height: 1.6;
        transition:
          border-color var(--t-fast),
          box-shadow var(--t-fast);
      }
      .quick-text:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
        outline: none;
      }
      .quick-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }
      .quick-hint {
        font-size: 12.5px;
        color: var(--faint);
        font-family: var(--font-mono);
      }
      .quick-go {
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--accent);
        border-radius: var(--radius);
        background: transparent;
        color: var(--accent-ink);
        font-size: 14px;
        font-weight: 600;
        transition: all var(--t-fast);
      }
      .quick-go:hover {
        background: var(--accent);
        color: var(--on-accent);
        transform: translateY(-1px);
      }

      .heatmap {
        display: flex;
        flex-direction: column;
        gap: 3px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .heat-row {
        display: flex;
        gap: 3px;
      }
      .heat-cell {
        width: 13px;
        height: 13px;
        border-radius: 2px;
        background: var(--surface-2);
        transition: transform var(--t-fast);
      }
      .heat-cell:hover {
        transform: scale(1.3);
      }
      .heat-cell[data-l="1"] {
        background: var(--heat-1);
      }
      .heat-cell[data-l="2"] {
        background: var(--heat-2);
      }
      .heat-cell[data-l="3"] {
        background: var(--heat-3);
      }
      .heat-cell[data-l="4"] {
        background: var(--heat-4);
      }
      .heat-legend {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--faint);
      }
      .heat-legend .sw {
        width: 13px;
        height: 13px;
        border-radius: 2px;
        background: var(--surface-2);
      }
      .heat-legend .sw:nth-of-type(2) {
        background: var(--heat-1);
      }
      .heat-legend .sw:nth-of-type(3) {
        background: var(--heat-2);
      }
      .heat-legend .sw:nth-of-type(4) {
        background: var(--heat-3);
      }
      .heat-legend .sw:nth-of-type(5) {
        background: var(--heat-4);
      }

      /* 账簿：两列对齐，tabular */
      .ledger-table {
        width: 100%;
        border-collapse: collapse;
      }
      .ledger-table tr {
        border-bottom: 1px dotted var(--border-strong);
      }
      .ledger-table td {
        padding: 8px 0;
        font-size: 14px;
      }
      .ledger-table .lg-name {
        width: 40%;
      }
      .ledger-table .lg-bar {
        width: 42%;
      }
      .ledger-table .lg-num {
        width: 18%;
        text-align: right;
        font-family: var(--font-mono);
        font-size: 13.5px;
        font-variant-numeric: tabular-nums;
        color: var(--accent-ink);
        font-weight: 600;
      }
      .bar-track {
        height: 6px;
        border-radius: 3px;
        background: var(--surface-2);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
      }
      .ledger-foot {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dotted var(--border-strong);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }
      .ledger-stat {
        font-size: 12.5px;
        color: var(--muted);
      }
      .ledger-stat b {
        display: block;
        font-family: var(--font-mono);
        font-size: 19px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        margin-top: 2px;
      }

      /* ============ 列表页 ============ */
      .list-layout {
        display: grid;
        grid-template-columns: 224px 1fr;
        gap: 20px;
        align-items: start;
      }
      .list-main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .list-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
      }
      .list-bar .search-form {
        flex: 1;
      }
      .count-chip {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .text-btn {
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        font-size: 13.5px;
        transition: all var(--t-fast);
      }
      .text-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .text-btn[data-on="true"] {
        color: var(--accent-ink);
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .new-note {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .new-note:hover {
        color: var(--on-accent);
        filter: brightness(1.07);
      }

      /* 分类树 */
      .cat-tree {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 12px 0;
      }
      .cat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 6px 12px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        transition: all var(--t-fast);
      }
      .cat-row:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .cat-row[data-active="true"] {
        color: var(--accent-ink);
        font-weight: 600;
        background: var(--accent-soft);
      }
      .cat-num {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .cat-toggle {
        width: 32px;
        min-height: 32px;
        border: none;
        background: none;
        color: var(--faint);
        font-size: 12px;
        border-radius: var(--radius-sm);
      }
      .cat-toggle:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .cat-list {
        list-style: none;
      }
      .cat-item {
        padding: 0 10px;
      }
      .cat-line {
        display: flex;
        align-items: center;
      }
      .cat-line .cat-row {
        flex: 1;
      }
      .cat-actions {
        display: none;
        gap: 2px;
        padding-right: 6px;
      }
      .cat-item:hover .cat-actions {
        display: flex;
      }
      .cat-act {
        min-height: 32px;
        padding: 0 7px;
        border: none;
        background: none;
        font-size: 12px;
        color: var(--faint);
        border-radius: var(--radius-sm);
      }
      .cat-act:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .cat-create {
        display: flex;
        gap: 6px;
        padding: 12px 12px 0;
      }
      .cat-create input {
        flex: 1;
        min-height: 40px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--text);
      }
      .cat-create input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .cat-create button {
        min-height: 40px;
        width: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
      }
      .cat-create button:hover {
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .tree-foot {
        margin-top: 10px;
        padding: 0 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--faint);
      }

      /* 笔记行：三区 */
      .note-rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .note-row {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-row);
        overflow: hidden;
        transition:
          box-shadow var(--t-fast),
          border-color var(--t-fast),
          transform var(--t-fast);
      }
      .note-row:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow-card);
        transform: translateY(-1px);
      }
      .note-main {
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
        padding: 15px 20px;
      }
      .note-title {
        flex: 2.2;
        min-width: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 16.5px;
        letter-spacing: 0.02em;
        line-height: 1.45;
      }
      .note-title .mark {
        background: var(--mark-bg);
        color: var(--mark-ink);
        border-radius: 2px;
        padding: 0 2px;
      }
      .note-summary {
        flex: 3;
        min-width: 0;
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .note-summary .mark {
        background: var(--mark-bg);
        color: var(--mark-ink);
        border-radius: 2px;
        padding: 0 2px;
      }
      .note-side {
        flex: 1.2;
        min-width: 0;
        text-align: right;
      }
      .note-meta {
        display: block;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.05em;
        background: var(--amber);
        color: #fff;
        vertical-align: 2px;
      }
      .badge.dim {
        background: var(--surface-2);
        color: var(--muted);
      }
      .note-foot {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        padding: 6px 16px 9px;
        border-top: 1px dotted var(--border);
      }
      .note-foot button {
        min-height: 34px;
        padding: 0 10px;
        border: none;
        background: none;
        font-size: 13px;
        color: var(--muted);
        border-radius: var(--radius-sm);
        transition: all var(--t-fast);
      }
      .note-foot button:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .note-foot button.danger:hover {
        color: var(--danger);
        background: var(--danger-soft);
      }

      /* 行内展开：高度过渡 */
      .note-detail {
        border-top: 1px dotted var(--border);
        padding: 16px 20px;
        background: var(--bg);
        animation: reveal var(--t-slow);
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
        to {
          opacity: 1;
        }
      }
      .d-meta {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        margin-bottom: 10px;
      }
      .detail-body {
        font-size: 14.5px;
        line-height: 1.75;
        color: var(--text);
      }
      .detail-body h1,
      .detail-body h2,
      .detail-body h3 {
        font-family: var(--font-display);
        margin: 14px 0 6px;
        line-height: 1.4;
      }
      .detail-body h2 {
        font-size: 19px;
      }
      .detail-body h3 {
        font-size: 16px;
      }
      .detail-body p {
        margin: 8px 0;
      }
      .detail-body ul,
      .detail-body ol {
        margin: 8px 0;
        padding-left: 22px;
      }
      .detail-body blockquote {
        margin: 10px 0;
        padding: 2px 14px;
        border-left: 3px solid var(--border-strong);
        color: var(--muted);
      }
      .detail-body code {
        font-family: var(--font-mono);
        font-size: 12.5px;
        background: var(--surface-2);
        border-radius: 3px;
        padding: 1px 5px;
      }
      .detail-body pre {
        margin: 10px 0;
        padding: 12px 14px;
        overflow-x: auto;
        background: var(--surface-2);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
      }
      .detail-body pre code {
        background: none;
        padding: 0;
      }
      .detail-body a {
        color: var(--accent-ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* 空态：线条画 */
      .empty {
        padding: 52px 24px;
        text-align: center;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .empty svg {
        width: 60px;
        height: 60px;
        color: var(--faint);
        opacity: 0.8;
      }
      .empty h3 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        margin-top: 14px;
      }
      .empty p {
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 6px;
      }
      .empty .empty-cta {
        margin-top: 16px;
      }
      .btn-primary {
        min-height: 42px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-size: 14px;
        font-weight: 600;
        transition:
          filter var(--t-fast),
          transform var(--t-fast);
      }
      .btn-primary:hover {
        filter: brightness(1.07);
        transform: translateY(-1px);
      }

      /* 骨架 */
      .skeleton {
        pointer-events: none;
      }
      .sk-line {
        height: 14px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          var(--surface-2) 25%,
          var(--surface) 50%,
          var(--surface-2) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      .sk-title {
        height: 20px;
        width: 55%;
        margin-bottom: 10px;
      }
      .sk-row {
        display: flex;
        gap: 18px;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        margin-bottom: 10px;
      }
      .sk-row .c1 {
        flex: 2.2;
      }
      .sk-row .c2 {
        flex: 3;
      }
      .sk-row .c3 {
        flex: 1.2;
      }
      .sk-row .sk-line {
        width: 80%;
      }

      /* ============ 详情页 ============ */
      .detail-head {
        margin-bottom: 22px;
      }
      .detail-title {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: clamp(22px, 2.6vw, 30px);
        line-height: 1.4;
        letter-spacing: 0.02em;
      }
      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .detail-meta .sep {
        color: var(--border-strong);
      }
      .detail-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .detail-actions button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        font-size: 13.5px;
        transition: all var(--t-fast);
      }
      .detail-actions button:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .detail-actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .detail-actions button.primary:hover {
        filter: brightness(1.07);
      }
      .detail-actions button.danger:hover {
        color: var(--danger);
        border-color: var(--danger);
      }
      .article {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 28px 30px;
      }
      .article .detail-body {
        font-size: 15px;
      }

      .lock-card {
        padding: 28px;
        text-align: center;
      }
      .lock-card .lock-ico {
        color: var(--amber);
      }
      .lock-card h3 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        margin-top: 12px;
      }
      .lock-card p {
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 6px;
      }
      .lock-form {
        max-width: 360px;
        margin: 18px auto 0;
        display: flex;
        gap: 8px;
      }
      .lock-form input {
        flex: 1;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--text);
      }
      .lock-form input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .lock-form button {
        min-height: 44px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 14px;
      }
      .lock-form button:hover {
        filter: brightness(1.07);
      }

      /* ============ 编辑器 ============ */
      .edit-field {
        margin-bottom: 16px;
      }
      .edit-field label {
        display: block;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.03em;
        margin-bottom: 8px;
      }
      .edit-field input[type="text"] {
        width: 100%;
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
      }
      .edit-field input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .edit-grid {
        display: grid;
        grid-template-columns: 5fr 7fr;
        gap: 16px;
        align-items: stretch;
      }
      .edit-pane,
      .preview-pane {
        min-width: 0;
      }
      .edit-pane textarea {
        width: 100%;
        height: 440px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 14.5px;
        line-height: 1.7;
        resize: vertical;
      }
      .edit-pane textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .preview-pane .card {
        height: 100%;
      }
      .preview-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px dotted var(--border);
      }
      .preview-head span {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 13.5px;
        letter-spacing: 0.03em;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px dotted var(--border);
      }
      .pill {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg);
        color: var(--muted);
        font-size: 13px;
        transition: all var(--t-fast);
      }
      .pill:hover {
        color: var(--text);
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }
      .pill[data-on="true"] {
        color: var(--accent-ink);
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .toolbar .grow {
        flex: 1;
      }
      .toolbar select {
        min-height: 36px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg);
        color: var(--muted);
        font-size: 13px;
      }
      .toolbar select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .ai-result {
        margin-top: 12px;
        padding: 14px 16px;
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: var(--radius-sm);
        animation: reveal var(--t-slow);
      }
      .ai-result .ai-tag {
        font-family: var(--font-mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: var(--accent-ink);
        text-transform: uppercase;
      }
      .ai-result p {
        margin-top: 6px;
        font-size: 13.5px;
        line-height: 1.7;
        color: var(--text);
      }
      .ai-result .ai-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .ai-result .ai-actions button {
        min-height: 34px;
        padding: 0 12px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
      }
      .ai-result .ai-actions .accept {
        background: var(--accent);
        color: var(--on-accent);
      }
      .ai-result .ai-actions .dismiss {
        background: transparent;
        color: var(--muted);
      }
      .ai-result .ai-actions .dismiss:hover {
        color: var(--text);
      }
      .editor-save {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 16px;
      }
      .editor-save button {
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        font-size: 14px;
      }
      .editor-save .save {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .editor-save button:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .editor-save .save:hover {
        color: var(--on-accent);
        filter: brightness(1.07);
      }

      /* ============ 回收站 ============ */
      .trash-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-row);
      }
      .trash-row .trash-title {
        flex: 1;
        min-width: 0;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 15.5px;
      }
      .trash-row .trash-meta {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .trash-row button {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        font-size: 13px;
      }
      .trash-row button:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .trash-row button.restore:hover {
        color: var(--accent-ink);
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .trash-row button.purge:hover {
        color: var(--danger);
        border-color: var(--danger);
        background: var(--danger-soft);
      }

      /* ============ Toast ============ */
      .toasts {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 100;
        align-items: center;
      }
      .toast {
        padding: 10px 18px;
        border-radius: var(--radius);
        background: var(--text);
        color: var(--bg);
        font-size: 13.5px;
        box-shadow: var(--shadow-lift);
        animation: toast-in 0.18s ease;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
        }
      }

      /* ============ 设备预览 ============ */
      .device-bar {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 90;
        display: flex;
        gap: 4px;
        padding: 6px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-card);
      }
      .device-bar button {
        min-height: 38px;
        padding: 0 14px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 12.5px;
        font-family: var(--font-mono);
      }
      .device-bar button[data-on="true"] {
        background: var(--accent);
        color: var(--on-accent);
      }
      html[data-device="mobile"] body .shell-inner {
        max-width: 420px;
        margin: 0 auto;
      }
      html[data-device="mobile"] .list-layout {
        grid-template-columns: 1fr;
      }
      html[data-device="mobile"] .home-grid {
        grid-template-columns: 1fr;
      }
      html[data-device="mobile"] .edit-grid {
        grid-template-columns: 1fr;
      }
      html[data-device="mobile"] .note-main {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      html[data-device="mobile"] .note-summary {
        white-space: normal;
      }
      html[data-device="mobile"] .note-side {
        text-align: left;
      }
      html[data-device="mobile"] .list-bar {
        flex-wrap: wrap;
      }
      html[data-device="mobile"] .list-bar .search-form {
        flex: 1 1 100%;
      }
      html[data-device="mobile"] .search-input {
        min-width: 0;
      }
      html[data-device="mobile"] .topnav a {
        padding: 8px 10px;
        font-size: 13.5px;
      }

      /* ============ 信息页 ============ */
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .info-grid .card h2 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.03em;
        margin-bottom: 12px;
      }
      .info-grid .dl {
        list-style: none;
      }
      .info-grid .dl li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        font-size: 13.5px;
      }
      .info-grid .dl li:not(:last-child) {
        border-bottom: 1px dotted var(--border);
      }
      .info-grid .dl dt {
        color: var(--muted);
      }
      .info-grid .dl dd {
        font-family: var(--font-mono);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      /* ============ 404 ============ */
      .notfound {
        text-align: center;
        padding: 80px 20px;
      }
      .notfound h1 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 64px;
        letter-spacing: 0.04em;
        color: var(--border-strong);
      }
      .notfound p {
        color: var(--muted);
        margin-top: 6px;
        font-size: 14px;
      }
      .notfound .btn-primary {
        margin-top: 22px;
      }

      @media (max-width: 1024px) {
        .list-layout {
          grid-template-columns: 1fr;
        }
        .home-grid {
          grid-template-columns: 1fr;
        }
        .edit-grid {
          grid-template-columns: 1fr;
        }
        .info-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        main {
          padding: 24px 14px 70px;
        }
        .topnav {
          overflow-x: auto;
        }
        .who {
          display: none;
        }
        .note-foot {
          justify-content: flex-start;
        }
        .head-stat {
          display: none;
        }
        .list-bar {
          flex-wrap: wrap;
        }
        .list-bar .search-form {
          flex: 1 1 100%;
        }
        .search-input {
          min-width: 0;
        }
      }
    </style>
  </head>

          >

            />
            <path d="M9.2 3.4v17.2" />
            <path d="M12.4 8.6h3.4M12.4 12h3.4" />
          </svg>
          <span>笔记</span>
        </a>
        <nav class="topnav" aria-label="主导航">

        </nav>
        <div class="spacer"></div>
        <a class="who" href="#/info" data-nav data-navkey="info">阿明</a>
        <button

        >
          <svg

            stroke="currentColor"

            stroke-linecap="round"
            stroke-linejoin="round"

          >
            <rect x="5" y="10" width="14" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
        </button>
        <button
          class="icon-btn"

          type="button"

          title="切换主题"
        >
          <svg
            viewBox="0 0 24 24"

        return String(s).replace(

              "&": "&amp;",

              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",

      }
      function md(src) {
        const lines = String(src).split("\n");
        let out = "",
          inCode = false,
          inList = false;
        for (let line of lines) {
          if (line.startsWith("```")) {
            if (inCode) out += "</pre>";
            else out += "<pre><code>";
            inCode = !inCode;
            continue;
          }
          if (inCode) {
            out += esc(line) + "\n";
            continue;
          }
          if (/^#\s/.test(line)) {
            out += `<h2>${esc(line.replace(/^#\s*/, ""))}</h2>`;
            continue;
          }
          if (/^##\s/.test(line)) {
            out += `<h3>${esc(line.replace(/^##\s*/, ""))}</h3>`;
            continue;
          }
          if (/^>\s/.test(line)) {
            out += `<blockquote>${esc(line.replace(/^>\s?/, ""))}</blockquote>`;
            continue;
          }
          if (/^-\s\[ \]/.test(line)) {
            if (!inList) {
              out += "<ul>";
              inList = true;
            }
            out += `<li>☐ ${esc(line.replace(/^-\s\[ \]\s?/, ""))}</li>`;
            continue;
          }
          if (/^-\s/.test(line)) {
            if (!inList) {
              out += "<ul>";
              inList = true;
            }
            out += `<li>${esc(line.replace(/^-\s+/, ""))}</li>`;
            continue;
          }
          if (inList) {
            out += "</ul>";
            inList = false;
          }
          if (line.trim() === "") continue;
          out += `<p>${esc(line)}</p>`;
        }
        if (inList) out += "</ul>";
        if (inCode) out += "</pre>";
        return out;
      }

  <section class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">回收站</h1>
        <p class="page-sub">${TRASH.length} 条 · 删除 30 天后自动清空</p>
      </div>
    </div>
    ${
      TRASH.length === 0
        ? vEmpty(
            "回收站是空的",
            "删除的笔记会在这里躺 30 天。",
            "回到全部笔记",
            "goNotes",
          )
        : `
    <div style="display:flex;flex-direction:column;gap:10px">
      ${TRASH.map(
        (t) => `
      <div class="trash-row">
        <span class="trash-title">${esc(t.title)}</span>
        <span class="trash-meta">${esc(t.deleted)} · ${esc(catName(t.cat))}</span>
        <button class="restore" type="button" data-restore="${t.id}">恢复</button>
        <button class="purge" type="button" data-purge="${t.id}">彻底删除</button>
      </div>`,
      ).join("")}
    </div>`
    }
  </section>`;
      }
      function vInfo() {
        const rows = [
          ["构建版本", "1.4.0（开发构建）"],
          ["构建时间", "2026-11-20 14:21:29"],
          ["服务地址", "127.0.0.1:8099"],
          ["数据文件", "notes.db"],
          ["用户名", "阿明"],
        ];
        return `
  <section class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">信息</h1>
        <p class="page-sub">运行信息 · 用户名 · AI 配置 · 主密码</p>
      </div>
    </div>
    <div class="info-grid">
      <div class="card card-pad">
        <h2>运行信息</h2>
        <dl class="dl">${rows.map((r) => `<li><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></li>`).join("")}</dl>
      </div>
      <div class="card card-pad">
        <h2>主密码</h2>
        <dl class="dl"><li><dt>状态</dt><dd>已设置</dd></li><li><dt>修改</dt><dd>可修改 · 不可找回</dd></li></dl>
      </div>
    </div>
  </section>`;
      }
      function v404() {
        return `
  <section class="page notfound">
    <h1>404</h1>
    <p>这一页不存在，或者已经被移走了。</p>
    <button class="btn-primary" type="button" data-act="goHome">回到概览</button>
  </section>`;
      }

      /* ---------------- 渲染 ---------------- */
      function render() {
        setActiveNav();
        const view = $("#view");
        if (currentRoute === "notes") {
          view.innerHTML = `<section class="page"><div class="page-head"><div><div class="sk-line sk-title"></div><div class="sk-line" style="width:38%"></div></div></div>
      <div class="sk-row"><div class="c1"><div class="sk-line"></div><div class="sk-line" style="width:60%;margin-top:8px"></div></div><div class="c2"><div class="sk-line" style="width:90%"></div></div><div class="c3"><div class="sk-line" style="width:70%"></div></div></div>
      <div class="sk-row"><div class="c1"><div class="sk-line" style="width:70%"></div></div><div class="c2"><div class="sk-line" style="width:80%"></div></div><div class="c3"><div class="sk-line" style="width:60%"></div></div></div></section>`;
          bindEvents();
          setTimeout(() => {
            if (currentRoute === "notes") {
              view.innerHTML = vNotes();
              bindEvents();
            }
          }, 420);
          return;
        }
        view.innerHTML = currentRoute.startsWith("note:")
          ? vDetail(currentRoute.split(":")[1])
          : currentRoute === "home"
            ? vHome()
            : currentRoute === "notes"
              ? vNotes()
              : currentRoute === "new"
                ? vEditor()
                : currentRoute === "trash"
                  ? vTrash()
                  : currentRoute === "info"
                    ? vInfo()
                    : v404();
        bindEvents();
        if (currentRoute === "home") {
          const hm = $("#heatmap");
          if (hm)
            hm.innerHTML = HEAT.map(
              (w) =>
                `<div class="heat-row">${w.map((d) => `<span class="heat-cell" data-l="${d}"></span>`).join("")}</div>`,
            ).join("");
        }
        if (currentRoute === "new") {
          const pb = $("#previewBody");
          if (pb) pb.innerHTML = md(editBody);
        }
      }
      function bindEvents() {
        const view = $("#view");
        view.querySelectorAll("[data-nav]").forEach((a) => {
          a.onclick = () => navigate(a.getAttribute("href"));
        });
        const hs = $("#homeSearch");
        if (hs)
          hs.onsubmit = (e) => {
            e.preventDefault();
            const q = hs.querySelector("input").value.trim();
            if (!q) return;
            listQuery = q;
            navigate("#/notes");
          };
        const ls = $("#listSearch");
        if (ls)
          ls.onsubmit = (e) => {
            e.preventDefault();
            listQuery = ls.querySelector("input").value.trim();
            render();
          };
        const qg = $("#quickGo");
        if (qg)
          qg.onclick = () => {
            const t = $("#quickText").value.trim();
            if (!t) return toast("写点什么再记下");
            toast(`已记入速记「${t.slice(0, 12)}…」`);
            $("#quickText").value = "";
          };
        view.querySelectorAll("[data-cat]").forEach((b) => {
          b.onclick = () => {
            listCat = Number(b.dataset.cat);
            listQuery = "";
            render();
          };
        });
        const ct = $("#catToggle");
        if (ct)
          ct.onclick = () => {
            const list = $("#catList");
            const open = list.style.display !== "none";
            list.style.display = open ? "none" : "block";
            ct.textContent = open ? "▸" : "▾";
          };
        view.querySelectorAll("[data-open]").forEach((b) => {
          b.onclick = () => {
            const id = b.dataset.open;
            const d = view.querySelector(`[data-detail="${id}"]`);
            d.hidden = !d.hidden;
          };
        });
        view.querySelectorAll("[data-edit]").forEach((b) => {
          b.onclick = () => {
            const n = NOTES.find((x) => x.id === b.dataset.edit);
            editTitle = n.title;
            editBody = n.body;
            navigate("#/new");
          };
        });
        view.querySelectorAll("[data-del]").forEach((b) => {
          b.onclick = () => {
            const n = NOTES.find((x) => x.id === b.dataset.del);
            toast(`已移入回收站「${n.title}」`);
            const idx = NOTES.findIndex((x) => x.id === n.id);
            NOTES.splice(idx, 1);
            TRASH.push({
              id: "t" + Date.now(),
              title: n.title,
              cat: n.cat,
              deleted: new Date()
                .toLocaleString("zh-CN", { hour12: false })
                .slice(0, 16)
                .replace(/\//g, "-"),
            });
            render();
          };
        });
        view.querySelectorAll("[data-copy]").forEach((b) => {
          b.onclick = () => {
            const n = NOTES.find((x) => x.id === b.dataset.copy);
            toast(
              n.encrypted && !sessionUnlocked
                ? "请先解锁"
                : "原文已复制到剪贴板",
            );
          };
        });
        const mt = $("#mergeToggle");
        if (mt)
          mt.onclick = () => {
            listMerging = !listMerging;
            listSelected = [];
            render();
          };
        view.querySelectorAll("[data-merge]").forEach((c) => {
          c.onchange = () => {
            const id = c.dataset.merge;
            if (c.checked) {
              if (!listSelected.includes(id)) listSelected.push(id);
            } else listSelected = listSelected.filter((x) => x !== id);
            const mc = $("#mergeCount");
            if (mc) mc.textContent = listSelected.length;
          };
        });
        const mg = $("#mergeGo");
        if (mg)
          mg.onclick = () => {
            if (listSelected.length < 2) return toast("至少勾选 2 条才能合并");
            const t = $("#mergeTitle").value.trim() || "合并-新笔记";
            toast(`已合并 ${listSelected.length} 条为「${t}」`);
            for (const id of listSelected) {
              const i = NOTES.findIndex((x) => x.id === id);
              if (i >= 0) NOTES.splice(i, 1);
            }
            listSelected = [];
            listMerging = false;
            render();
          };
        view.querySelectorAll("[data-act]").forEach((b) => {
          b.onclick = () => {
            const a = b.dataset.act;
            if (a === "clearFilter") {
              listQuery = "";
              listCat = 0;
              render();
            }
            if (a === "goNotes") {
              navigate("#/notes");
            }
            if (a === "goHome") {
              navigate("#/home");
            }
            if (a === "ai") {
              aiOn = true;
              render();
            }
            if (a === "aiAccept") {
              aiOn = false;
              const tb = $("#editBody");
              if (tb) editBody = tb.value + "\n\n（已采纳 AI 建议的示例文本）";
              render();
            }
            if (a === "aiDismiss") {
              aiOn = false;
              render();
            }
            if (a === "cancelEdit") {
              navigate("#/notes");
            }
            if (a === "unlockHere") {
              sessionUnlocked = false;
              render();
            }
          };
        });
        view.querySelectorAll("[data-tpl]").forEach((b) => {
          b.onclick = () => {
            const tb = $("#editBody");
            if (!tb) return;
            editBody =
              b.dataset.tpl === "meeting"
                ? "# 周会纪要\n\n## 本周\n\n- \n\n## 下周\n\n- "
                : "# 需求背景\n\n";
            tb.value = editBody;
            render();
          };
        });
        const et = $("#editTitle");
        if (et)
          et.oninput = () => {
            editTitle = et.value;
          };
        const eb = $("#editBody");
        if (eb)
          eb.oninput = () => {
            editBody = eb.value;
            const pb = $("#previewBody");
            if (pb) pb.innerHTML = md(editBody);
          };
        const ef = $("#editorForm");
        if (ef)
          ef.onsubmit = (e) => {
            e.preventDefault();
            toast(`已保存「${editTitle}」`);
            navigate("#/notes");
          };
        const uf = $("#unlockForm");
        if (uf)
          uf.onsubmit = (e) => {
            e.preventDefault();
            const v = uf.querySelector("input").value;
            if (!v) return;
            sessionUnlocked = true;
            toast("已解锁");
            render();
          };
        view.querySelectorAll("[data-restore]").forEach((b) => {
          b.onclick = () => {
            const t = TRASH.find((x) => x.id === b.dataset.restore);
            NOTES.push({
              id: "n" + Date.now(),
              title: t.title,
              cat: t.cat,
              updated: new Date()
                .toLocaleString("zh-CN", { hour12: false })
                .slice(0, 16)
                .replace(/\//g, "-"),
              encrypted: false,
              body: "",
            });
            TRASH.splice(
              TRASH.findIndex((x) => x.id === t.id),
              1,
            );
            toast(`已恢复「${t.title}」`);
            render();
          };
        });
        view.querySelectorAll("[data-purge]").forEach((b) => {
          b.onclick = () => {
            const t = TRASH.find((x) => x.id === b.dataset.purge);
            TRASH.splice(
              TRASH.findIndex((x) => x.id === t.id),
              1,
            );
            toast(`已彻底删除「${t.title}」`);
            render();
          };
        });
      }

      /* ---------------- 主题 / 设备 ---------------- */
      const THEMES = ["light", "dark", "eye-care"];
      let themeIdx = 0;
      function applyTheme(t) {
        themeIdx = THEMES.indexOf(t);
        if (themeIdx < 0) themeIdx = 0;
        document.documentElement.dataset.theme = t;
        try {
          localStorage.setItem("note.demo.theme", t);
        } catch (e) {}
      }
      $("#themeBtn").onclick = () => {
        themeIdx = (themeIdx + 1) % THEMES.length;
        applyTheme(THEMES[themeIdx]);
        toast(
          `主题：${THEMES[themeIdx] === "eye-care" ? "护眼（米绿纸）" : THEMES[themeIdx] === "dark" ? "暗色（深墨纸）" : "亮色（白纸）"}`,
        );
      };
      $("#lockBtn").onclick = () => {
        sessionUnlocked = false;
        toast("已锁定");
        if (currentRoute.startsWith("note:")) {
          const id = currentRoute.split(":")[1];
          const n = NOTES.find((x) => x.id === id);
          if (n && n.encrypted) render();
        }
      };
      $("#devDesktop").onclick = () => {
        document.documentElement.dataset.device = "desktop";
        $("#devDesktop").dataset.on = "true";
        $("#devMobile").dataset.on = "false";
      };
      $("#devMobile").onclick = () => {
        document.documentElement.dataset.device = "mobile";
        $("#devMobile").dataset.on = "true";
        $("#devDesktop").dataset.on = "false";
      };

      /* ---------------- 启动 ---------------- */
      (function init() {
        try {
          const t = localStorage.getItem("note.demo.theme");
          if (t) applyTheme(t);
        } catch (e) {}
        window.addEventListener("hashchange", () =>
          navigate(location.hash || "#/home"),
        );
        navigate(location.hash || "#/home");
      })();
    </script>
  </body>
</html>
